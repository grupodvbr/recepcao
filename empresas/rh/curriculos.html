<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#f8fafc);
  color:#111827;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  background:#fff;
  padding:18px;
  text-align:center;
  font-weight:700;
  font-size:18px;
  border-bottom:1px solid #e5e7eb;
  z-index:10;
}

/* WRAPPER CENTRAL */
.wrapper{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}

/* CARD */
.card{
  width:100%;
  max-width:1000px;
  background:#fff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

/* GRID BASE */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

/* TABLET */
@media(min-width:700px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}

/* DESKTOP */
@media(min-width:1100px){
  .grid{
    grid-template-columns:1fr 1fr 1fr;
  }

  .full{
    grid-column:span 3;
  }
}

/* LABEL */
label{
  font-size:12px;
  font-weight:600;
  margin-bottom:5px;
  display:block;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  font-size:14px;
  transition:.2s;
}

/* FOCUS */
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#f59e0b;
  background:#fff;
  box-shadow:0 0 0 2px rgba(245,158,11,0.15);
}

/* TEXTAREA */
textarea{
  resize:none;
  min-height:90px;
}

/* FILE */
input[type="file"]{
  padding:12px;
}

/* PROGRESS */
.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:6px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
  transition:.3s;
}

/* BOTÃO */
.footer{
  max-width:1000px;
  margin:20px auto;
}

button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  color:#fff;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(245,158,11,.3);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#fff;
  padding:26px;
  border-radius:18px;
  width:90%;
  max-width:340px;
  text-align:center;
}

.modal-box h3{
  color:#22c55e;
}
</style>

</head>

<body>

<div class="header">Portal de currículos</div>

<form class="card" id="form">

<div class="grid">

<div>
<label>Nome</label>
<input id="nome" required>
</div>

<div>
<label>Idade</label>
<input id="idade" type="number" required>
</div>

<div>
<label>Sexo</label>
<select id="sexo">
<option>Masculino</option>
<option>Feminino</option>
</select>
</div>

<div>
<label>Whatsapp</label>
<input 
  id="telefone" 
  type="tel"
  inputmode="numeric"
  pattern="[0-9]*"
  placeholder="(77) 99999-9999"
  required
>
</div>

<div class="full">
<label>E-mail</label>
<input id="email">
</div>

<div>
<label>Empresa que deseja trabalhar</label>
<select id="empresa">
<option>MERCATTO DELÍCIA (Barreiras)</option>
<option>VILLA GOURMET(Luis Eduardo)</option>
<option>PADARIA DELÍCIA (Barreiras)</option>
<option>M.KIDS (Barreiras)</option>
<option>DELÍCIA GOURMET (Barreiras)</option>
</select>
</div>

<div>
<label>Cargo desejado</label>
<input id="area">
</div>

<div class="full">
<label>Observações</label>
<textarea id="obs"></textarea>
</div>

<div class="full">
<label>Anexo do currículo (PDF, WORD ou PNG</label>
<input type="file" id="arquivo">
</div>

<div class="full">
<div class="progress"><span id="bar"></span></div>
</div>

</div>

</form>

<div class="footer">
<button id="btn">Enviar Currículo</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>✔ Enviado</h3>
    <p id="texto"></p>
    <button onclick="modal.classList.remove('active')">OK</button>
  </div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const btn = document.getElementById("btn");
const bar = document.getElementById("bar");
const modal = document.getElementById("modal");
const texto = document.getElementById("texto");

btn.onclick = async () => {

  bar.style.width="20%";

  const nome = nome.value;
  const idade = parseInt(idade.value);
  const sexo = sexo.value;
  const telefone = telefone.value;
  const email = email.value;
  const empresa = empresa.value;
  const area = area.value.toUpperCase();
  const obs = document.getElementById("obs").value;

  const file = arquivo.files[0];
  const fileName = Date.now()+"_"+file.name;

  await client.storage.from("curriculos").upload(fileName,file);

  bar.style.width="70%";

  const { data } = client.storage.from("curriculos").getPublicUrl(fileName);

  await client.from("curriculo_candidatos").insert({
    nome, idade, sexo, telefone, email,
    empresa,
    area_interesse: area,
    observacoes: obs,
    arquivo_url: data.publicUrl,
    nome_arquivo: file.name
  });

  bar.style.width="100%";

  texto.innerHTML = `Obrigado <b>${nome}</b><br>Enviado para <b>${empresa}</b>`;
  modal.classList.add("active");
};

const telInput = document.getElementById("telefone");

telInput.addEventListener("input", (e) => {
  let v = e.target.value.replace(/\D/g, "");

  if (v.length > 11) v = v.slice(0,11);

  if (v.length > 6) {
    v = v.replace(/^(\d{2})(\d{5})(\d+)/, "($1) $2-$3");
  } else if (v.length > 2) {
    v = v.replace(/^(\d{2})(\d+)/, "($1) $2");
  } else {
    v = v.replace(/^(\d*)/, "($1");
  }

  e.target.value = v;
});
  
</script>

</body>
</html>

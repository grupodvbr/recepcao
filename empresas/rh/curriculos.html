<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco • Grupo DV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#f7f9fc,#eef2f7);
  color:#111827;
}

/* HEADER */
.header{
  padding:18px;
  text-align:center;
  font-weight:800;
  font-size:18px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

/* CONTAINER */
.container{
  padding:18px;
  max-width:520px;
  margin:auto;
}

/* CARD */
.card{
  background:#fff;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.06);
  animation:fade .4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* TITULO */
.title{
  font-size:20px;
  font-weight:800;
  text-align:center;
  margin-bottom:15px;
}

/* INPUTS */
label{
  font-size:13px;
  font-weight:600;
  margin-top:12px;
  display:block;
}

input,select{
  width:100%;
  padding:15px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  font-size:14px;
  transition:.2s;
}

input:focus,select:focus{
  border-color:#f59e0b;
  background:#fff;
  outline:none;
}

/* BOTÃO */
button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  font-weight:700;
  font-size:15px;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

/* PROGRESS */
.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:6px;
  overflow:hidden;
  margin-top:12px;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
  transition:.3s;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#fff;
  padding:28px;
  border-radius:18px;
  width:90%;
  max-width:320px;
  text-align:center;
  animation:pop .3s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-box h2{
  color:#22c55e;
}

.modal-box p{
  margin-top:10px;
  font-size:14px;
  color:#374151;
}

.modal-box button{
  background:#111827;
  margin-top:15px;
}
</style>

</head>

<body>

<div class="header">Grupo DV • Trabalhe Conosco</div>

<div class="container">
<form class="card" id="form">

<div class="title">Envie seu currículo</div>

<label>Nome completo *</label>
<input id="nome" required>

<label>Idade *</label>
<input id="idade" type="number" required>

<label>Sexo *</label>
<select id="sexo" required>
<option value="">Selecione</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>

<label>Telefone *</label>
<input id="telefone" required>

<label>Email</label>
<input id="email">

<label>Empresa *</label>
<select id="empresa" required>
<option value="">Selecione</option>
<option>MERCATTO DELÍCIA</option>
<option>VILLA GOURMET</option>
<option>PADARIA DELÍCIA</option>
<option>M.KIDS</option>
<option>DELÍCIA GOURMET</option>
</select>

<label>Área de Interesse *</label>
<input id="area" required placeholder="EX: GARÇOM, COZINHA...">

<label>Currículo *</label>
<input type="file" id="arquivo" required>

<div class="progress"><span id="bar"></span></div>

<button id="btn">Enviar Currículo</button>

</form>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>✔ Enviado com sucesso</h2>
    <p id="texto"></p>
    <button onclick="fechar()">Fechar</button>
  </div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const form = document.getElementById("form");
const bar = document.getElementById("bar");
const btn = document.getElementById("btn");
const modal = document.getElementById("modal");
const texto = document.getElementById("texto");

function fechar(){
  modal.classList.remove("active");
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  btn.disabled = true;
  bar.style.width = "20%";

  try{

    const nome = document.getElementById("nome").value;
    const idade = parseInt(document.getElementById("idade").value);
    const sexo = document.getElementById("sexo").value;
    const telefone = document.getElementById("telefone").value;
    const email = document.getElementById("email").value;
    const empresa = document.getElementById("empresa").value;
    const area = document.getElementById("area").value.toUpperCase();

    const file = document.getElementById("arquivo").files[0];
    const fileName = Date.now()+"_"+file.name;

    bar.style.width = "40%";

    await client.storage.from("curriculos").upload(fileName,file);

    bar.style.width = "70%";

    const { data } = client.storage.from("curriculos").getPublicUrl(fileName);

    await client.from("curriculo_candidatos").insert({
      nome, idade, sexo, telefone, email,
      empresa,
      area_interesse: area,
      arquivo_url: data.publicUrl,
      nome_arquivo: file.name
    });

    bar.style.width = "100%";

    texto.innerHTML = `Obrigado <b>${nome}</b><br>Seu currículo foi enviado para <b>${empresa}</b>.`;
    modal.classList.add("active");

    form.reset();

  }catch(err){
    alert("Erro: "+err.message);
  }

  btn.disabled = false;
});
</script>

</body>
</html>

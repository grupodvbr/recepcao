<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco • Grupo DV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0b0e14,#111827);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:520px;
  padding:20px;
}

.card{
  background:#121826;
  border-radius:20px;
  padding:28px;
  box-shadow:0 25px 60px rgba(0,0,0,.7);
  border:1px solid #1f2937;
}

h1{
  text-align:center;
  margin-bottom:10px;
  color:#f59e0b;
  font-weight:800;
}

.sub{
  text-align:center;
  font-size:13px;
  color:#9ca3af;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:600;
  font-size:13px;
}

input, select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #1f2937;
  background:#0b0e14;
  color:#fff;
  font-size:14px;
}

input:focus,select:focus{
  border-color:#f59e0b;
  outline:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  font-weight:700;
  font-size:15px;
  color:#000;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.progress{
  height:6px;
  background:#1f2937;
  border-radius:6px;
  overflow:hidden;
  margin-top:12px;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
  transition:.3s;
}

.msg{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.ok{color:#22c55e}
.err{color:#ef4444}

.footer{
  text-align:center;
  font-size:12px;
  margin-top:20px;
  color:#6b7280;
}
</style>

</head>

<body>

<div class="container">
  <form class="card" id="form">

    <h1>Trabalhe Conosco</h1>
    <div class="sub">Grupo DV • Envie seu currículo</div>

    <label>Nome completo *</label>
    <input id="nome" required>

    <label>Idade *</label>
    <input id="idade" type="number" required>

    <label>Sexo *</label>
    <select id="sexo" required>
      <option value="">Selecione</option>
      <option>Masculino</option>
      <option>Feminino</option>
      <option>Outro</option>
    </select>

    <label>Telefone *</label>
    <input id="telefone" required>

    <label>Email</label>
    <input id="email">

    <label>Empresa *</label>
    <select id="empresa" required>
      <option value="">Selecione</option>
      <option>MERCATTO DELÍCIA</option>
      <option>VILLA GOURMET</option>
      <option>PADARIA DELÍCIA</option>
      <option>M.KIDS</option>
      <option>DELÍCIA GOURMET</option>
    </select>

    <label>Área de Interesse *</label>
    <input id="area" placeholder="EX: GARÇOM, COZINHA..." required>

    <label>Currículo *</label>
    <input type="file" id="arquivo" required>

    <div class="progress"><span id="bar"></span></div>

    <button id="btn">Enviar Currículo</button>

    <div id="msg" class="msg"></div>

  </form>

  <div class="footer">© Grupo DV • Sistema de Recrutamento</div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const bar = document.getElementById("bar");
const btn = document.getElementById("btn");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  btn.disabled = true;
  msg.textContent = "Enviando...";
  msg.className = "msg";

  bar.style.width = "15%";

  try{

    const nome = document.getElementById("nome").value.trim();
    const idade = parseInt(document.getElementById("idade").value);
    const sexo = document.getElementById("sexo").value;
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const empresa = document.getElementById("empresa").value;
    const area = document.getElementById("area").value.trim().toUpperCase();
    const file = document.getElementById("arquivo").files[0];

    if(!file) throw new Error("Selecione um arquivo");

    const fileName = Date.now() + "_" + file.name;

    bar.style.width = "40%";

    const { error: uploadError } = await client.storage
      .from("curriculos")
      .upload(fileName, file);

    if(uploadError) throw uploadError;

    bar.style.width = "70%";

    const { data: urlData } = client.storage
      .from("curriculos")
      .getPublicUrl(fileName);

    const { error: insertError } = await client
      .from("curriculo_empresas")
      .insert({
        nome,
        idade,
        sexo,
        telefone,
        email,
        empresa,
        area_interesse: area,
        arquivo_url: urlData.publicUrl,
        nome_arquivo: file.name
      });

    if(insertError) throw insertError;

    bar.style.width = "100%";

    msg.innerHTML = `✅ Obrigado <b>${nome}</b>!<br>Seu currículo foi enviado para <b>${empresa}</b>.`;
    msg.className = "msg ok";

    form.reset();

  }catch(err){
    msg.textContent = "Erro: " + err.message;
    msg.className = "msg err";
  }

  btn.disabled = false;
});
</script>

</body>
</html>

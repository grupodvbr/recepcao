<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco • Grupo DV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0b0e14,#111827);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:520px;
  padding:20px;
}

.card{
  background:#121826;
  border-radius:20px;
  padding:28px;
  box-shadow:0 25px 60px rgba(0,0,0,.7);
  border:1px solid #1f2937;
}

h1{
  text-align:center;
  color:#f59e0b;
}

label{
  display:block;
  margin-top:12px;
  font-weight:600;
  font-size:13px;
}

input, select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:12px;
  border:1px solid #1f2937;
  background:#0b0e14;
  color:#fff;
}

button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  font-weight:700;
  color:#000;
  cursor:pointer;
}

.progress{
  height:6px;
  background:#1f2937;
  border-radius:6px;
  overflow:hidden;
  margin-top:12px;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#121826;
  padding:30px;
  border-radius:16px;
  text-align:center;
  max-width:320px;
}

.modal-box h2{
  color:#22c55e;
}

.modal-box button{
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
<form class="card" id="form">

<h1>Trabalhe Conosco</h1>

<label>Nome *</label>
<input id="nome" required>

<label>Idade *</label>
<input id="idade" type="number" required>

<label>Sexo *</label>
<select id="sexo" required>
<option value="">Selecione</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>

<label>Telefone *</label>
<input id="telefone" required>

<label>Email</label>
<input id="email">

<label>Empresa *</label>
<select id="empresa" required>
<option value="">Selecione</option>
<option>MERCATTO DELÍCIA</option>
<option>VILLA GOURMET</option>
<option>PADARIA DELÍCIA</option>
<option>M.KIDS</option>
<option>DELÍCIA GOURMET</option>
</select>

<label>Área *</label>
<input id="area" required>

<label>Currículo *</label>
<input type="file" id="arquivo" required>

<div class="progress"><span id="bar"></span></div>

<button id="btn">Enviar Currículo</button>

</form>
</div>

<!-- MODAL SUCESSO -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>✅ Enviado com sucesso!</h2>
    <p id="textoSucesso"></p>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const form = document.getElementById("form");
const bar = document.getElementById("bar");
const btn = document.getElementById("btn");

const modal = document.getElementById("modal");
const textoSucesso = document.getElementById("textoSucesso");

function fecharModal(){
  modal.classList.remove("active");
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  btn.disabled = true;
  bar.style.width = "15%";

  try{

    const nome = nome.value.trim();
    const idadeVal = parseInt(idade.value);
    const sexoVal = sexo.value;
    const telefoneVal = telefone.value.trim();
    const emailVal = email.value.trim();
    const empresaVal = empresa.value;
    const areaVal = area.value.toUpperCase();

    const file = arquivo.files[0];
    if(!file) throw new Error("Arquivo obrigatório");

    const fileName = Date.now()+"_"+file.name;

    bar.style.width = "40%";

    await client.storage.from("curriculos").upload(fileName,file);

    bar.style.width = "70%";

    const { data } = client.storage.from("curriculos").getPublicUrl(fileName);

    await client.from("buffet.curriculo_candidatos").insert({
      nome,
      idade: idadeVal,
      sexo: sexoVal,
      telefone: telefoneVal,
      email: emailVal,
      empresa: empresaVal,
      area_interesse: areaVal,
      arquivo_url: data.publicUrl,
      nome_arquivo: file.name
    });

    bar.style.width = "100%";

    textoSucesso.innerHTML = `
      Obrigado <b>${nome}</b><br>
      Seu currículo foi enviado para <b>${empresaVal}</b>.
    `;

    modal.classList.add("active");
    form.reset();

  }catch(err){
    alert("Erro: " + err.message);
  }

  btn.disabled = false;
});
</script>

</body>
</html>

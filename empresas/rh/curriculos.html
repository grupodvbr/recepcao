<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco • Grupo DV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f3f5f9;
  color:#111;
}

/* HEADER */
.header{
  text-align:center;
  padding:10px;
  font-weight:700;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

/* CARD */
.card{
  padding:12px;
  max-width:520px;
  margin:auto;
}

/* GRID SUPER COMPACTO */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.full{grid-column:span 2}

/* LABEL */
label{
  font-size:10px;
  font-weight:600;
}

/* INPUT */
input,select,textarea{
  width:100%;
  padding:9px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#fff;
  font-size:12px;
}

/* OBS */
textarea{
  height:45px;
  resize:none;
}

/* FILE */
input[type="file"]{
  padding:6px;
}

/* PROGRESS */
.progress{
  height:4px;
  background:#eee;
  border-radius:4px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
}

/* BOTÃO FIXO */
.footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#fff;
  padding:10px;
  border-top:1px solid #ddd;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  color:#fff;
  font-weight:700;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#fff;
  padding:18px;
  border-radius:12px;
  text-align:center;
}
</style>

</head>

<body>

<div class="header">Trabalhe Conosco</div>

<form class="card" id="form">

<div class="grid">

<div>
<label>Nome</label>
<input id="nome" required>
</div>

<div>
<label>Idade</label>
<input id="idade" type="number" required>
</div>

<div>
<label>Sexo</label>
<select id="sexo">
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>
</div>

<div>
<label>Telefone</label>
<input id="telefone">
</div>

<div class="full">
<label>Email</label>
<input id="email">
</div>

<div>
<label>Empresa</label>
<select id="empresa">
<option>MERCATTO DELÍCIA</option>
<option>VILLA GOURMET</option>
<option>PADARIA DELÍCIA</option>
<option>M.KIDS</option>
<option>DELÍCIA GOURMET</option>
</select>
</div>

<div>
<label>Área</label>
<input id="area">
</div>

<div class="full">
<label>Observações</label>
<textarea id="obs"></textarea>
</div>

<div class="full">
<label>Currículo</label>
<input type="file" id="arquivo">
</div>

<div class="full">
<div class="progress"><span id="bar"></span></div>
</div>

</div>

</form>

<div class="footer">
<button id="btn">Enviar Currículo</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>✔ Enviado</h3>
    <p id="texto"></p>
    <button onclick="modal.classList.remove('active')">OK</button>
  </div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const btn = document.getElementById("btn");
const bar = document.getElementById("bar");
const modal = document.getElementById("modal");
const texto = document.getElementById("texto");

btn.onclick = async () => {

  bar.style.width="20%";

  const nome = nome.value;
  const idade = parseInt(idade.value);
  const sexo = sexo.value;
  const telefone = telefone.value;
  const email = email.value;
  const empresa = empresa.value;
  const area = area.value.toUpperCase();
  const obs = document.getElementById("obs").value;

  const file = arquivo.files[0];
  const fileName = Date.now()+"_"+file.name;

  await client.storage.from("curriculos").upload(fileName,file);

  bar.style.width="70%";

  const { data } = client.storage.from("curriculos").getPublicUrl(fileName);

  await client.from("curriculo_candidatos").insert({
    nome, idade, sexo, telefone, email,
    empresa,
    area_interesse: area,
    observacoes: obs,
    arquivo_url: data.publicUrl,
    nome_arquivo: file.name
  });

  bar.style.width="100%";

  texto.innerHTML = `Obrigado <b>${nome}</b><br>Enviado para <b>${empresa}</b>`;
  modal.classList.add("active");
};
</script>

</body>
</html>

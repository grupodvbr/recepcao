<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Trabalhe Conosco • Grupo DV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f6fb;
  color:#111827;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  padding:12px;
  text-align:center;
  font-weight:800;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

/* CONTAINER */
.container{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* CARD */
.card{
  width:100%;
  max-width:600px;
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

/* FULL */
.full{
  grid-column:span 2;
}

/* INPUTS */
label{
  font-size:11px;
  font-weight:600;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#f9fafb;
  font-size:13px;
}

textarea{
  resize:none;
  height:60px;
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#f59e0b;
  background:#fff;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#f59e0b,#d97706);
  font-weight:700;
  color:#fff;
  cursor:pointer;
}

/* PROGRESS */
.progress{
  height:5px;
  background:#e5e7eb;
  border-radius:5px;
  overflow:hidden;
  margin-top:6px;
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:#f59e0b;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:14px;
  text-align:center;
  width:90%;
  max-width:280px;
}

.modal-box h2{
  color:#22c55e;
}

.modal-box button{
  background:#111827;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="header">Grupo DV • Trabalhe Conosco</div>

<div class="container">

<form class="card" id="form">

<div class="grid">

<div>
<label>Nome</label>
<input id="nome" required>
</div>

<div>
<label>Idade</label>
<input id="idade" type="number" required>
</div>

<div>
<label>Sexo</label>
<select id="sexo" required>
<option value="">---</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>
</div>

<div>
<label>Telefone</label>
<input id="telefone" required>
</div>

<div class="full">
<label>Email</label>
<input id="email">
</div>

<div>
<label>Empresa</label>
<select id="empresa" required>
<option value="">---</option>
<option>MERCATTO DELÍCIA</option>
<option>VILLA GOURMET</option>
<option>PADARIA DELÍCIA</option>
<option>M.KIDS</option>
<option>DELÍCIA GOURMET</option>
</select>
</div>

<div>
<label>Área</label>
<input id="area" required>
</div>

<div class="full">
<label>Observações</label>
<textarea id="obs" placeholder="Algo que você acha importante..."></textarea>
</div>

<div class="full">
<label>Currículo</label>
<input type="file" id="arquivo" required>
</div>

<div class="full">
<div class="progress"><span id="bar"></span></div>
</div>

<div class="full">
<button id="btn">Enviar</button>
</div>

</div>

</form>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>✔ Enviado</h2>
    <p id="texto"></p>
    <button onclick="fechar()">OK</button>
  </div>
</div>

<script>
const client = window.supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

const form = document.getElementById("form");
const bar = document.getElementById("bar");
const btn = document.getElementById("btn");
const modal = document.getElementById("modal");
const texto = document.getElementById("texto");

function fechar(){
  modal.classList.remove("active");
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  btn.disabled = true;
  bar.style.width = "20%";

  try{

    const nome = document.getElementById("nome").value;
    const idade = parseInt(document.getElementById("idade").value);
    const sexo = document.getElementById("sexo").value;
    const telefone = document.getElementById("telefone").value;
    const email = document.getElementById("email").value;
    const empresa = document.getElementById("empresa").value;
    const area = document.getElementById("area").value.toUpperCase();
    const observacoes = document.getElementById("obs").value;

    const file = document.getElementById("arquivo").files[0];
    const fileName = Date.now()+"_"+file.name;

    bar.style.width = "50%";

    await client.storage.from("curriculos").upload(fileName,file);

    const { data } = client.storage.from("curriculos").getPublicUrl(fileName);

    await client.from("curriculo_candidatos").insert({
      nome, idade, sexo, telefone, email,
      empresa,
      area_interesse: area,
      observacoes,
      arquivo_url: data.publicUrl,
      nome_arquivo: file.name
    });

    bar.style.width = "100%";

    texto.innerHTML = `Obrigado <b>${nome}</b><br>Enviado para <b>${empresa}</b>`;
    modal.classList.add("active");

    form.reset();

  }catch(err){
    alert("Erro: "+err.message);
  }

  btn.disabled = false;
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal do Fornecedor • Mercatto</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --primary:#0f172a;
  --primary2:#111827;
  --bg:#f3f4f6;
  --card:#ffffff;
  --border:#e5e7eb;
  --muted:#6b7280;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#ca8a04;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --radius:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:var(--bg);
  color:#111827;
}

/* ================= LOGIN ================= */

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:30px;
  padding:34px;
  box-shadow:var(--shadow);
}

.logo{
  width:70px;
  height:70px;
  border-radius:20px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:24px;
}

.login-card h1{
  font-size:32px;
  margin-bottom:10px;
}

.login-card p{
  color:var(--muted);
  margin-bottom:24px;
}

.login-card input{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
  margin-bottom:14px;
  font-size:15px;
  outline:none;
}

.login-card input:focus{
  border-color:#111827;
}

.login-card button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

/* ================= APP ================= */

.app{
  display:none;
}

/* ================= TOPO ================= */

.top{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 24px;
  position:sticky;
  top:0;
  z-index:100;
}

.top-flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.top-left h1{
  font-size:28px;
  margin-bottom:4px;
}

.top-left small{
  color:var(--muted);
}

.top-right{
  display:flex;
  gap:10px;
}

.btn{
  border:none;
  padding:12px 16px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.btn-refresh{
  background:#111827;
  color:#fff;
}

.btn-logout{
  background:#ef4444;
  color:#fff;
}

/* ================= CONTAINER ================= */

.container{
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ================= COTAÇÃO ================= */

.card{
  background:#fff;
  border-radius:26px;
  padding:24px;
  box-shadow:var(--shadow);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.card-top h2{
  font-size:24px;
}

.card-top small{
  color:var(--muted);
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.badge{
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.badge-ativa{
  background:#dcfce7;
  color:#166534;
}

.badge-finalizada{
  background:#fee2e2;
  color:#991b1b;
}

/* ================= ITEM ================= */

.item{
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
}

.item-top{
  margin-bottom:16px;
}

.item-top h3{
  font-size:18px;
  margin-bottom:6px;
}

.item-top small{
  color:var(--muted);
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
}

.box{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.box span{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}

.box input,
.box textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  font-size:14px;
  outline:none;
}

.box input:focus,
.box textarea:focus{
  border-color:#111827;
}

.box textarea{
  min-height:100px;
  resize:none;
}

/* ================= AÇÕES ================= */

.actions{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  flex-wrap:wrap;
  margin-top:18px;
}

.btn-save{
  background:#111827;
  color:#fff;
}

.btn-clear{
  background:#f3f4f6;
}

/* ================= OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(4px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  font-size:22px;
  font-weight:900;
}

/* ================= EMPTY ================= */

.empty{
  background:#fff;
  border-radius:24px;
  padding:60px 20px;
  text-align:center;
  box-shadow:var(--shadow);
}

.empty h2{
  margin-bottom:8px;
}

.empty p{
  color:var(--muted);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .container{
    padding:18px;
  }

  .top{
    padding:18px;
  }

  .card{
    padding:18px;
  }

  .card-top h2{
    font-size:20px;
  }

}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login" id="login">

  <div class="login-card">

    <div class="logo">
      M
    </div>

    <h1>Portal do Fornecedor</h1>

    <p>
      Acesse suas cotações pendentes.
    </p>

    <input
      id="cnpj"
      placeholder="CNPJ"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

  </div>

</div>

<!-- ================= APP ================= -->

<div class="app" id="app">

  <div class="top">

    <div class="top-flex">

      <div class="top-left">

        <h1 id="nomeFornecedor">
          Fornecedor
        </h1>

        <small id="infoFornecedor"></small>

      </div>

      <div class="top-right">

        <button
          class="btn btn-refresh"
          onclick="carregarCotacoes()">

          Atualizar

        </button>

        <button
          class="btn btn-logout"
          onclick="sair()">

          Sair

        </button>

      </div>

    </div>

  </div>

  <div class="container" id="listaCotacoes"></div>

</div>

<!-- ================= OVERLAY ================= -->

<div class="overlay" id="overlay">
  Processando...
</div>

<script>

const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let fornecedor = JSON.parse(
  localStorage.getItem("fornecedor_logado")
);

if(fornecedor){
  iniciar();
}

/* =========================
   OVERLAY
========================= */

function overlay(show){

  document.getElementById("overlay")
    .style.display = show
      ? "flex"
      : "none";
}

/* =========================
   LOGIN
========================= */

async function entrar(){

  const cnpj = document
    .getElementById("cnpj")
    .value
    .replace(/\D/g,"");

  const senha = document
    .getElementById("senha")
    .value
    .trim();

  if(!cnpj){
    alert("Informe o CNPJ");
    return;
  }

  if(!senha){
    alert("Informe a senha");
    return;
  }

  overlay(true);

  const { data, error } = await sb
    .from("fornecedores_mercatto")
    .select("*")
    .eq("ativo", true);

  overlay(false);

  if(error){

    console.log(error);

    alert("Erro ao acessar");

    return;
  }

  const encontrado = (data || [])
    .find(f => {

      const bancoCnpj =
        String(f.cnpj || "")
        .replace(/\D/g,"");

      const bancoSenha =
        String(f.senha || "").trim();

      return (
        bancoCnpj === cnpj &&
        bancoSenha === senha
      );
    });

  if(!encontrado){

    alert(
      "CNPJ ou senha inválidos"
    );

    return;
  }

  fornecedor = encontrado;

  localStorage.setItem(
    "fornecedor_logado",
    JSON.stringify(fornecedor)
  );

  iniciar();
}

/* =========================
   INICIAR
========================= */

async function iniciar(){

  document
    .getElementById("login")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";

  document
    .getElementById("nomeFornecedor")
    .innerText =
      fornecedor.nome;

  document
    .getElementById("infoFornecedor")
    .innerText =
      fornecedor.cnpj || "";

  await carregarCotacoes();
}

/* =========================
   COTAÇÕES
========================= */

async function carregarCotacoes(){

  overlay(true);

  const { data, error } = await sb

    .from("cotacoes")

    .select("*")

    .contains(
      "fornecedores_ids",
      [fornecedor.id]
    )

    .order(
      "data_cotacao",
      { ascending:false }
    );

  overlay(false);

  if(error){

    console.log(error);

    alert("Erro ao carregar");

    return;
  }

  renderCotacoes(data || []);
}

/* =========================
   RENDER
========================= */

function renderCotacoes(cotacoes){

  const lista =
    document.getElementById(
      "listaCotacoes"
    );

  lista.innerHTML = "";

  if(!cotacoes.length){

    lista.innerHTML = `

      <div class="empty">

        <h2>
          Nenhuma cotação pendente
        </h2>

        <p>
          Você não possui cotações
          disponíveis no momento.
        </p>

      </div>

    `;

    return;
  }

  cotacoes.forEach(c => {

    const itens = c.itens || [];

    lista.innerHTML += `

      <div class="card">

        <div class="card-top">

          <div>

            <h2>
              ${c.nome || "Cotação"}
            </h2>

            <small>
              ${formatarData(c.data_cotacao)}
            </small>

            <div class="badges">

              <div class="badge ${
                c.status === "finalizada"
                  ? "badge-finalizada"
                  : "badge-ativa"
              }">

                ${(c.status || "ativa")
                  .toUpperCase()}

              </div>

            </div>

          </div>

        </div>

        ${itens.map((i,index)=>{

          const key =
            "cot_"+c.id+"_"+index;

          const cache = JSON.parse(
            localStorage.getItem(key)
            || "{}"
          );

          return `

            <div class="item">

              <div class="item-top">

                <h3>
                  ${i.produto || "-"}
                </h3>

                <small>

                  Atual:
                  ${i.atual || 0}

                  •

                  Comprar:
                  ${i.comprar || 0}

                  •

                  Ideal:
                  ${i.ideal || 0}

                </small>

              </div>

              <div class="grid">

                <div class="box">

                  <span>Marca</span>

                  <input
                    value="${cache.marca || ""}"
                    oninput="
                      salvarLocal(
                        '${key}',
                        'marca',
                        this.value
                      )
                    "
                  >

                </div>

                <div class="box">

                  <span>Preço</span>

                  <input
                    value="${cache.preco || ""}"
                    oninput="
                      this.value =
                        money(this.value);

                      salvarLocal(
                        '${key}',
                        'preco',
                        this.value
                      )
                    "
                  >

                </div>

                <div class="box">

                  <span>Prazo</span>

                  <input
                    value="${cache.prazo || ""}"
                    oninput="
                      salvarLocal(
                        '${key}',
                        'prazo',
                        this.value
                      )
                    "
                  >

                </div>

                <div class="box">

                  <span>Observação</span>

                  <textarea
                    oninput="
                      salvarLocal(
                        '${key}',
                        'obs',
                        this.value
                      )
                    "
                  >${cache.obs || ""}</textarea>

                </div>

              </div>

            </div>

          `;

        }).join("")}

        <div class="actions">

          <button
            class="btn btn-clear"
            onclick="limpar(${c.id})">

            Limpar

          </button>

          <button
            class="btn btn-save"
            onclick="enviar(${c.id})">

            Enviar Cotação

          </button>

        </div>

      </div>

    `;
  });
}

/* =========================
   SALVAR LOCAL
========================= */

function salvarLocal(
  key,
  campo,
  valor
){

  let obj = JSON.parse(
    localStorage.getItem(key)
    || "{}"
  );

  obj[campo] = valor;

  localStorage.setItem(
    key,
    JSON.stringify(obj)
  );
}

/* =========================
   ENVIAR
========================= */

async function enviar(cotacaoId){

  overlay(true);

  const { data } = await sb

    .from("cotacoes")

    .select("*")

    .eq("id", cotacaoId)

    .single();

  let itens = data.itens || [];

  for(let i=0; i<itens.length; i++){

    const key =
      "cot_"+cotacaoId+"_"+i;

    const cache = JSON.parse(
      localStorage.getItem(key)
      || "{}"
    );

    if(
      !cache.preco ||
      !cache.marca
    ){
      continue;
    }

    itens[i].cotado = true;

    itens[i].fornecedor_id =
      fornecedor.id;

    itens[i].fornecedor_nome =
      fornecedor.nome;

    itens[i].marca =
      cache.marca;

    itens[i].preco_cotado =
      Number(
        String(cache.preco)
        .replace(/\./g,"")
        .replace(",", ".")
      );

    itens[i].prazo =
      cache.prazo || "";

    itens[i].observacao =
      cache.obs || "";

    itens[i].respondido_em =
      new Date();

  }

  await sb

    .from("cotacoes")

    .update({
      itens,
      status:"respondida"
    })

    .eq("id", cotacaoId);

  overlay(false);

  alert(
    "Cotação enviada com sucesso"
  );

  carregarCotacoes();
}

/* =========================
   LIMPAR
========================= */

function limpar(cotacaoId){

  Object.keys(localStorage)

    .filter(k =>
      k.startsWith(
        "cot_"+cotacaoId+"_"
      )
    )

    .forEach(k => {

      localStorage.removeItem(k);

    });

  carregarCotacoes();
}

/* =========================
   SAIR
========================= */

function sair(){

  localStorage.removeItem(
    "fornecedor_logado"
  );

  location.reload();
}

/* =========================
   HELPERS
========================= */

function formatarData(data){

  if(!data) return "-";

  return new Date(data)
    .toLocaleString("pt-BR");
}



function money(v){

  v = v.replace(/\D/g,"");

  v = (Number(v)/100)
    .toFixed(2);

  return v
    .replace(".",",")
    .replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
</script>

</body>
</html>

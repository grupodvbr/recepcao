<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal do Fornecedor • Mercatto</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --line:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --primary:#111827;
  --green:#16a34a;
  --yellow:#ca8a04;
  --red:#dc2626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* ================= LOGIN ================= */

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
}

.logo{
  width:60px;
  height:60px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.login-card h1{
  font-size:26px;
  margin-bottom:8px;
}

.login-card p{
  color:var(--muted);
  margin-bottom:20px;
  font-size:14px;
}

.login-card input{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
  outline:none;
}

.login-card button{
  width:100%;
  border:none;
  background:#111827;
  color:#fff;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

/* ================= APP ================= */

.app{
  display:none;
}

/* ================= TOPO ================= */

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.top-flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.top h1{
  font-size:22px;
  font-weight:800;
}

.top small{
  color:var(--muted);
}

.top-actions{
  display:flex;
  gap:10px;
}

.btn{
  border:none;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.btn-red{
  background:#dc2626;
}

/* ================= CONTAINER ================= */

.container{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* ================= CARD ================= */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

/* ================= HEADER ================= */

.card-top{
  padding:14px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  background:#fafafa;
}

.card-top h2{
  font-size:17px;
  margin-bottom:4px;
}

.card-top small{
  color:var(--muted);
  font-size:12px;
}

.status{
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.ativa{
  background:#dcfce7;
  color:#166534;
}

.respondida{
  background:#fef3c7;
  color:#92400e;
}

.finalizada{
  background:#fee2e2;
  color:#991b1b;
}

/* ================= TABELA ================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1400px;
}

thead{
  background:#f9fafb;
}

th{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:11px;
  font-weight:700;
  color:#6b7280;
  white-space:nowrap;
}

td{
  padding:8px 12px;
  border-bottom:1px solid #f1f5f9;
  vertical-align:top;
  font-size:13px;
}

/* ================= INPUT ================= */

.input{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
  outline:none;
}

/* ================= INFO ================= */

.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  width:max-content;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.done{
  background:#dcfce7;
  color:#166534;
}

/* ================= ACTIONS ================= */

.actions{
  padding:14px 18px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:10px;
  background:#fafafa;
}

.btn-light{
  background:#f3f4f6;
  color:#111827;
}

/* ================= EMPTY ================= */

.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:60px;
  text-align:center;
  color:#6b7280;
}

/* ================= OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(4px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  font-weight:800;
  font-size:20px;
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login" id="login">

  <div class="login-card">

    <div class="logo">
      M
    </div>

    <h1>Portal do Fornecedor</h1>

    <p>
      Acesse suas cotações
    </p>

    <input
      id="cnpj"
      placeholder="CNPJ"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

  </div>

</div>

<!-- ================= APP ================= -->

<div class="app" id="app">

  <div class="top">

    <div class="top-flex">

      <div>

        <h1 id="nomeFornecedor">
          Fornecedor
        </h1>

        <small id="infoFornecedor"></small>

      </div>

      <div class="top-actions">

        <button
          class="btn"
          onclick="carregarCotacoes()">

          Atualizar

        </button>

        <button
          class="btn btn-red"
          onclick="sair()">

          Sair

        </button>

      </div>

    </div>

  </div>

  <div
    class="container"
    id="listaCotacoes">
  </div>

</div>

<!-- ================= OVERLAY ================= -->

<div
  class="overlay"
  id="overlay">

  Processando...

</div>

<script>

const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let fornecedor = JSON.parse(
  localStorage.getItem("fornecedor_logado")
);

if(fornecedor){
  iniciar();
}

/* ================= LOGIN ================= */

async function entrar(){

  const cnpj = document
    .getElementById("cnpj")
    .value
    .replace(/\D/g,"");

  const senha = document
    .getElementById("senha")
    .value
    .trim();

  overlay(true);

  const { data } = await sb

    .from("fornecedores_mercatto")

    .select("*")

    .eq("ativo", true);

  overlay(false);

  const encontrado = (data || [])

    .find(f => {

      return (
        String(f.cnpj || "")
        .replace(/\D/g,"")
        === cnpj

        &&

        String(f.senha || "")
        .trim()
        === senha
      );

    });

  if(!encontrado){

    alert(
      "CNPJ ou senha inválidos"
    );

    return;
  }

  fornecedor = encontrado;

  localStorage.setItem(
    "fornecedor_logado",
    JSON.stringify(fornecedor)
  );

  iniciar();
}

/* ================= INICIAR ================= */

async function iniciar(){

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";

  document.getElementById("nomeFornecedor")
    .innerText = fornecedor.nome;

  document.getElementById("infoFornecedor")
    .innerText = fornecedor.cnpj;

  await carregarCotacoes();
}

/* ================= COTAÇÕES ================= */

async function carregarCotacoes(){

  overlay(true);

  const { data, error } = await sb

    .from("cotacoes")

    .select("*")

    .order(
      "data_cotacao",
      { ascending:false }
    );

  overlay(false);

  if(error){

    console.log(error);

    alert("Erro ao carregar");

    return;
  }

  const filtradas = (data || [])

    .filter(c => {

      const itens =
        c.itens_cotacao || [];

      return itens.some(i => {

        return (
          i.fornecedores || []
        ).some(f =>

          f.fornecedor_id === fornecedor.id

        );

      });

    });

  renderCotacoes(filtradas);
}

/* ================= RENDER ================= */

function renderCotacoes(cotacoes){

  const lista =
    document.getElementById(
      "listaCotacoes"
    );

  lista.innerHTML = "";

  if(!cotacoes.length){

    lista.innerHTML = `

      <div class="empty">

        Nenhuma cotação disponível

      </div>

    `;

    return;
  }

  cotacoes.forEach(c => {

    const itens =
      c.itens_cotacao || [];

    lista.innerHTML += `

      <div class="card">

        <!-- HEADER -->

        <div class="card-top">

          <div>

            <h2>
              ${c.nome || "Cotação"}
            </h2>

            <small>
              ${formatarData(c.data_cotacao)}
            </small>

          </div>

          <div class="
            status

            ${
              c.status === "finalizada"
              ? "finalizada"

              : c.status === "respondida"
              ? "respondida"

              : "ativa"
            }
          ">

            ${(c.status || "ativa")
              .toUpperCase()}

          </div>

        </div>

        <!-- TABELA -->

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Produto</th>
                <th>Qtd</th>
                <th>Marca</th>
                <th>Preço</th>
                <th>Total</th>
                <th>Unidade</th>
                <th>Emb.</th>
                <th>Prazo</th>
                <th>Observação</th>
                <th>Status</th>

              </tr>

            </thead>

            <tbody>

              ${itens.map((i,index)=>{

                const meuFornecedor =
                  (i.fornecedores || [])

                  .find(f =>

                    f.fornecedor_id === fornecedor.id

                  );

                if(!meuFornecedor)
                  return "";

                const key =
                  "cot_"+c.id+"_"+index;

                const cache = JSON.parse(

                  localStorage.getItem(key)

                  || JSON.stringify({

                    preco:
                      meuFornecedor.preco_unitario || "",

                    marca:
                      meuFornecedor.marca || "",

                    obs:
                      meuFornecedor.observacao || "",

                    prazo:
                      meuFornecedor.prazo || "",

                    unidade:
                      meuFornecedor.unidade || "UN",

                    embalagem:
                      meuFornecedor.quantidade_embalagem || 1

                  })

                );

                return `

                  <tr>

                    <!-- PRODUTO -->

                    <td>

                      <b>
                        ${i.produto}
                      </b>

                    </td>

                    <!-- QTD -->

                    <td>

                      ${i.qtd_solicitada || 0}

                    </td>

                    <!-- MARCA -->

                    <td>

                      <input
                        class="input"

                        value="${cache.marca || ""}"

                        oninput="
                          salvarLocal(
                            '${key}',
                            'marca',
                            this.value
                          )
                        "
                      >

                    </td>

                    <!-- PREÇO -->

                    <td>

                      <input
                        class="input"

                        value="${cache.preco || ""}"

                        oninput="
                          this.value =
                            money(this.value);

                          salvarLocal(
                            '${key}',
                            'preco',
                            this.value
                          )
                        "
                      >

                    </td>

                    <!-- TOTAL -->

                    <td>

                      <b>

                        ${
                          cache.preco

                          ? "R$ " + (

                            Number(
                              String(cache.preco)
                              .replace(/\./g,"")
                              .replace(",",".")
                            )

                            *

                            Number(
                              i.qtd_solicitada || 0
                            )

                            / 100

                          ).toFixed(2)

                          : "-"
                        }

                      </b>

                    </td>

                    <!-- UNIDADE -->

                    <td>

                      <input
                        class="input"

                        value="${cache.unidade || "UN"}"

                        oninput="
                          salvarLocal(
                            '${key}',
                            'unidade',
                            this.value
                          )
                        "
                      >

                    </td>

                    <!-- EMB -->

                    <td>

                      <input
                        type="number"

                        class="input"

                        value="${
                          cache.embalagem || 1
                        }"

                        oninput="
                          salvarLocal(
                            '${key}',
                            'embalagem',
                            this.value
                          )
                        "
                      >

                    </td>

                    <!-- PRAZO -->

                    <td>

                      <input
                        class="input"

                        value="${cache.prazo || ""}"

                        oninput="
                          salvarLocal(
                            '${key}',
                            'prazo',
                            this.value
                          )
                        "
                      >

                    </td>

                    <!-- OBS -->

                    <td>

                      <textarea

                        class="input"

                        style="
                          min-height:38px;
                          resize:vertical;
                        "

                        oninput="
                          salvarLocal(
                            '${key}',
                            'obs',
                            this.value
                          )
                        "

                      >${cache.obs || ""}</textarea>

                    </td>

                    <!-- STATUS -->

                    <td>

                      <div class="
                        badge

                        ${
                          meuFornecedor.preco_unitario
                          ? "done"
                          : "pending"
                        }
                      ">

                        ${
                          meuFornecedor.preco_unitario
                          ? "RESPONDIDO"
                          : "PENDENTE"
                        }

                      </div>

                    </td>

                  </tr>

                `;

              }).join("")}

            </tbody>

          </table>

        </div>

        <!-- RODAPÉ -->

        <div class="actions">

          <button
            class="btn btn-light"
            onclick="limpar('${c.id}')">

            Limpar

          </button>

          <button
            class="btn"
            onclick="enviar('${c.id}')">

            Enviar Cotação

          </button>

        </div>

      </div>

    `;

  });

}

/* ================= LOCAL ================= */

function salvarLocal(
  key,
  campo,
  valor
){

  let obj = JSON.parse(
    localStorage.getItem(key)
    || "{}"
  );

  obj[campo] = valor;

  localStorage.setItem(
    key,
    JSON.stringify(obj)
  );
}

/* ================= ENVIAR ================= */

async function enviar(cotacaoId){

  overlay(true);

  const { data } = await sb

    .from("cotacoes")

    .select("*")

    .eq("id", cotacaoId)

    .single();

  let itens =
    data.itens_cotacao || [];

  for(let i=0; i<itens.length; i++){

    const item = itens[i];

    const fornecedorIndex =
      (item.fornecedores || [])

      .findIndex(f =>

        f.fornecedor_id === fornecedor.id

      );

    if(fornecedorIndex === -1)
      continue;

    const key =
      "cot_"+cotacaoId+"_"+i;

    const cache = JSON.parse(
      localStorage.getItem(key)
      || "{}"
    );

    if(
      !cache.preco ||
      !cache.marca
    ){
      continue;
    }

    item.fornecedores[
      fornecedorIndex
    ] = {

      ...item.fornecedores[
        fornecedorIndex
      ],

      preco_unitario:Number(
        String(cache.preco)
        .replace(/\./g,"")
        .replace(",", ".")
      ),

      preco_total:
        Number(
          String(cache.preco)
          .replace(/\./g,"")
          .replace(",", ".")
        ) * Number(
          item.qtd_solicitada || 0
        ),

      marca:
        cache.marca || "",

      observacao:
        cache.obs || "",

      prazo:
        cache.prazo || "",

      unidade:
        cache.unidade || "UN",

      quantidade_embalagem:
        Number(
          cache.embalagem || 1
        ),

      respondido_em:
        new Date()

    };

  }

  await sb

    .from("cotacoes")

    .update({

      itens_cotacao:itens,
      atualizado_em:new Date(),
      status:"respondida"

    })

    .eq("id", cotacaoId);

  overlay(false);

  alert(
    "Cotação enviada com sucesso"
  );

  carregarCotacoes();
}

/* ================= LIMPAR ================= */

function limpar(cotacaoId){

  Object.keys(localStorage)

    .filter(k =>

      k.startsWith(
        "cot_"+cotacaoId+"_"
      )

    )

    .forEach(k => {

      localStorage.removeItem(k);

    });

  carregarCotacoes();
}

/* ================= SAIR ================= */

function sair(){

  localStorage.removeItem(
    "fornecedor_logado"
  );

  location.reload();
}

/* ================= HELPERS ================= */

function overlay(show){

  document.getElementById("overlay")
    .style.display =
      show ? "flex" : "none";
}

function formatarData(data){

  if(!data) return "-";

  return new Date(data)
    .toLocaleString("pt-BR");
}

function money(v){

  v = v.replace(/\D/g,"");

  v = (Number(v)/100)
    .toFixed(2);

  return v
    .replace(".",",")
    .replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

/* ================= REALTIME ================= */

sb.channel("cotacoes_realtime")

.on(
  "postgres_changes",
  {
    event:"UPDATE",
    schema:"public",
    table:"cotacoes"
  },
  payload => {

    carregarCotacoes();

  }
)

.subscribe();

</script>

</body>
</html>
